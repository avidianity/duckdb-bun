name: Release

# Builds every platform package from the release tag, runs the test suites on each, and publishes to npm
# through trusted publishing (OIDC): no npm token secret exists. See MAINTENANCE.md for the setup.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build and publish, such as v1.0.1
        required: true
        type: string
      publish:
        description: Publish to npm. Off builds and tests the platform packages only, for scripts/first-publish.ts.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

jobs:
  # docs/adr/0003, 0005: the Linux shims are built in this image, so they need glibc 2.36 or newer.
  # The digest pins a multi-platform image index, so each runner pulls its own architecture's image.
  build-linux:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    container: rust:1.99.1-bookworm@sha256:e6f2cff35d0f309acf8433b4f05878ed77092602c5065cc81801177da0bb3a9c
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
    defaults:
      run:
        shell: bash
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # rustup installs the toolchain and components that rust-toolchain.toml pins.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `github.workspace` is the host path in a container job, so the path comes from GITHUB_WORKSPACE.
      - name: Point the Rust build at this platform's libduckdb
        run: echo "DUCKDB_LIB_DIR=$GITHUB_WORKSPACE/packages/duckdb-bun-$PLATFORM" >> "$GITHUB_ENV"

      - name: Fetch libduckdb
        run: bun run fetch-lib "$PLATFORM"

      - name: Build the native shim
        run: bun run build:native

      - name: Check versions against the tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run check-version --tag "$RELEASE_TAG"

      - name: cargo test
        working-directory: native
        run: cargo test

      - name: API suite (tests/api)
        run: bun run test:api

      - name: Bindings suite (tests/bindings)
        run: bun run test:bindings

      - name: Parity with @duckdb/node-api
        run: bun run parity

      # The heavy suites run one at a time, each in its own step.
      - name: Compile proof
        run: bun run test:compile

      - name: Leak test
        run: bun run test:leak

      - name: Event loop stress test
        run: bun run test:stress

      - name: Crash report test
        run: bun run test:crash

      - name: Issue 3060 reproduction
        run: bun run test:issue-3060

      - name: Remaining tests
        run: bun run test:unit

      # Paired runs against the baseline on this runner (bench/baseline.ts): the @duckdb/node-api reference, or the
      # previous release when npm has no reference for the pinned DuckDB. Fails when bench/gate.ts says ours is worse.
      - name: Bench gate against the baseline
        run: bun run bench --gate

      - name: Upload the bench results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ matrix.platform }}
          path: bench/results/
          if-no-files-found: warn
          retention-days: 90

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: duckdb-bun-${{ matrix.platform }}
          path: packages/duckdb-bun-${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 7

  build-darwin-arm64:
    name: build (darwin-arm64)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      PLATFORM: darwin-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # rustup installs the toolchain and components that rust-toolchain.toml pins.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Point the Rust build at this platform's libduckdb
        run: echo "DUCKDB_LIB_DIR=$GITHUB_WORKSPACE/packages/duckdb-bun-$PLATFORM" >> "$GITHUB_ENV"

      - name: Fetch libduckdb
        run: bun run fetch-lib "$PLATFORM"

      - name: Build the native shim
        run: bun run build:native

      - name: Check versions against the tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run check-version --tag "$RELEASE_TAG"

      - name: cargo test
        working-directory: native
        run: cargo test

      - name: API suite (tests/api)
        run: bun run test:api

      - name: Bindings suite (tests/bindings)
        run: bun run test:bindings

      - name: Parity with @duckdb/node-api
        run: bun run parity

      # The heavy suites run one at a time, each in its own step.
      - name: Compile proof
        run: bun run test:compile

      - name: Leak test
        run: bun run test:leak

      - name: Event loop stress test
        run: bun run test:stress

      - name: Crash report test
        run: bun run test:crash

      - name: Issue 3060 reproduction
        run: bun run test:issue-3060

      - name: Remaining tests
        run: bun run test:unit

      # Paired runs against the baseline on this runner (bench/baseline.ts): the @duckdb/node-api reference, or the
      # previous release when npm has no reference for the pinned DuckDB. Fails when bench/gate.ts says ours is worse.
      - name: Bench gate against the baseline
        run: bun run bench --gate

      - name: Upload the bench results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-darwin-arm64
          path: bench/results/
          if-no-files-found: warn
          retention-days: 90

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: duckdb-bun-darwin-arm64
          path: packages/duckdb-bun-darwin-arm64/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build-linux, build-darwin-arm64]
    if: github.event_name == 'release' || inputs.publish
    # npm trusted publishing does not support self-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: duckdb-bun-linux-x64
          path: packages/duckdb-bun-linux-x64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: duckdb-bun-linux-arm64
          path: packages/duckdb-bun-linux-arm64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: duckdb-bun-darwin-arm64
          path: packages/duckdb-bun-darwin-arm64

      - name: Check versions and native files against the tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run check-version --tag "$RELEASE_TAG" --publish

      # The one exception to the Bun-only rule: npm trusted publishing needs the npm CLI (11.5.1 or newer)
      # and Node 22.14.0 or newer, so this job installs Node only to run `npm publish`.
      # Node 26.13.1 ships npm 11.20.0.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Platform packages first, so the main package never points at a version that is not on npm yet.
      # Trusted publishing adds provenance on its own. Every version is a stable x.y.z (ADR 0004), published as `latest`.
      # A version that is already on npm is skipped, so a failed run can be re-run.
      - name: Publish to npm
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          publish() {
            local dir="$1"
            local name
            name="$(bun -p "require('./$dir/package.json').name")"
            local status
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' "https://registry.npmjs.org/${name/\//%2f}/$version")"
            if [ "$status" = "200" ]; then
              echo "$name@$version is already on npm; skipping."
              return
            fi
            npm publish "./$dir" --access public --tag latest
          }
          publish packages/duckdb-bun-linux-x64
          publish packages/duckdb-bun-linux-arm64
          publish packages/duckdb-bun-darwin-arm64
          publish .
