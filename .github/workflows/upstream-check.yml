name: Upstream check

# Weekly: compares the pins with the latest DuckDB release and the latest @duckdb/node-api on npm,
# and opens one issue per newer version. An issue with the same title, open or closed, is never opened again.
# Issue bodies keep package names in backticks, so `@duckdb/...` never mentions a GitHub team.
on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Compare the pins with upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bun run --silent check-version --upstream-json > "$RUNNER_TEMP/upstream.json"
          cat "$RUNNER_TEMP/upstream.json"

      - name: Open an issue per newer version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/upstream.json"

          open_once() {
            local title="$1" body="$2" count
            count="$(gh issue list --state all --search "in:title \"$title\"" --json title --limit 100 \
              | jq --arg title "$title" 'map(select(.title == $title)) | length')"
            if [ "$count" != "0" ]; then
              echo "An issue titled \"$title\" exists; skipping."
              return
            fi
            gh issue create --title "$title" --body "$body"
          }

          if [ "$(jq -r .duckdb.newer "$report")" = "true" ]; then
            latest="$(jq -r .duckdb.latest "$report")"
            open_once "DuckDB v$latest is released" "$(printf '%s\n' \
              "DuckDB v$latest is released: $(jq -r .duckdb.url "$report")" \
              "The pin in \`src/version.ts\` is v$(jq -r .duckdb.pinned "$report")." \
              "Follow MAINTENANCE.md to upgrade.")"
          fi

          if [ "$(jq -r .nodeApi.newer "$report")" = "true" ]; then
            latest="$(jq -r .nodeApi.latest "$report")"
            open_once "@duckdb/node-api $latest is released" "$(printf '%s\n' \
              "\`@duckdb/node-api\` $latest is on npm: $(jq -r .nodeApi.url "$report")" \
              "The \`devDependencies\` pin in \`package.json\` is $(jq -r .nodeApi.pinned "$report")." \
              "Follow MAINTENANCE.md to re-vendor and upgrade.")"
          fi
