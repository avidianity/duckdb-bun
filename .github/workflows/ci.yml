name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The upstream-check workflow dispatches CI on the upgrade branches it pushes: a pull request opened with
  # GITHUB_TOKEN starts its pull_request run only after approval, but workflow_dispatch always creates a run.
  workflow_dispatch:
  # Nightly: the same jobs, with the fuzz step at nightly length (bun run fuzz:nightly).
  schedule:
    - cron: "0 3 * * *" # every day 03:00 UTC

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The release image for the Linux shims (docs/adr/0003, 0005) and the production runtime image.
  # Both digests pin a multi-platform image index, so each runner pulls its own architecture's image.
  RUST_IMAGE: rust:1.99.1-bookworm@sha256:e6f2cff35d0f309acf8433b4f05878ed77092602c5065cc81801177da0bb3a9c
  BUN_IMAGE: oven/bun:1.4.4-slim@sha256:1846adf22496bd711036aae8be147e57bdebbaea2e5264e3e0b5af1db187d9a4

jobs:
  test:
    name: test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          # GitHub-hosted arm64 Linux runner, free for public repositories (docs/adr/0005).
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-latest
            platform: darwin-arm64
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # rustup installs the toolchain and components that rust-toolchain.toml pins.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Point the Rust build at this platform's libduckdb
        run: echo "DUCKDB_LIB_DIR=$GITHUB_WORKSPACE/packages/duckdb-bun-$PLATFORM" >> "$GITHUB_ENV"

      - name: Cache libduckdb
        id: libduckdb
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/duckdb-bun-${{ matrix.platform }}/libduckdb.*
          key: libduckdb-${{ matrix.platform }}-${{ hashFiles('src/version.ts', 'scripts/fetch-lib.ts') }}

      - name: Fetch libduckdb
        if: steps.libduckdb.outputs.cache-hit != 'true'
        run: bun run fetch-lib "$PLATFORM"

      - name: cargo fmt
        working-directory: native
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: native
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: native
        run: cargo test

      # The crash handler's own crate: it crashes child processes and checks their reports.
      - name: cargo fmt, clippy and test of the crash handler (native/diag-tests)
        working-directory: native/diag-tests
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build the native shim
        run: bun run build:native

      - name: Check versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run check-version

      - name: Biome
        run: bun run lint:ci

      - name: Type check
        run: bun run typecheck

      - name: API suite (tests/api)
        run: bun run test:api

      - name: Bindings suite (tests/bindings)
        run: bun run test:bindings

      - name: Parity with @duckdb/node-api
        run: bun run parity

      # Property-based and fuzz tests against the official packages (tests/fuzz/). Pushes and pull requests use a
      # fixed seed; the nightly run draws a new one and prints it first. A failure prints the command that replays it.
      - name: Fuzz against @duckdb/node-api and @duckdb/node-bindings
        run: bun run ${{ github.event_name == 'schedule' && 'fuzz:nightly' || 'fuzz' }}

      # The nightly run keeps the last case each fuzz file started, for a crash fast-check could not report.
      - name: Upload the fuzz trace
        if: ${{ failure() && github.event_name == 'schedule' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-trace-${{ matrix.platform }}
          path: fuzz-trace/
          if-no-files-found: ignore
          retention-days: 30

      # The heavy suites run one at a time, each in its own step.
      - name: Compile proof
        run: bun run test:compile

      - name: Leak test
        run: bun run test:leak

      - name: Event loop stress test
        run: bun run test:stress

      # STRESS_SEED from a failed run's log repeats its random choices.
      - name: Concurrency stress test
        run: bun run test:concurrency

      - name: Crash report test
        run: bun run test:crash

      - name: Issue 3060 reproduction
        run: bun run test:issue-3060

      - name: Worker terminate test
        run: bun run test:worker-terminate

      - name: Remaining tests
        run: bun run test:unit

      # Paired runs against @duckdb/node-api on this runner; fails when ours is slower or heavier than bench/gate.ts allows.
      - name: Bench gate against @duckdb/node-api
        run: bun run bench --gate

      - name: Upload the bench results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ matrix.platform }}
          path: bench/results/
          if-no-files-found: warn
          retention-days: 90

  # Line and function coverage of src/ and of the Rust shim, with the floors in scripts/coverage.ts
  # (CONTRIBUTING.md "Coverage"). The lcov reports are uploaded for every run.
  coverage:
    name: coverage (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLATFORM: linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # cargo-llvm-cov needs the llvm-tools component of the pinned toolchain.
      - name: Install the Rust toolchain and llvm-tools
        run: |
          rustup toolchain install
          rustup component add llvm-tools
          rustc --version

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-llvm-cov@0.9.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native -> target
          key: coverage

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Point the Rust build at this platform's libduckdb
        run: echo "DUCKDB_LIB_DIR=$GITHUB_WORKSPACE/packages/duckdb-bun-$PLATFORM" >> "$GITHUB_ENV"

      - name: Cache libduckdb
        id: libduckdb
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/duckdb-bun-linux-x64/libduckdb.*
          key: libduckdb-linux-x64-${{ hashFiles('src/version.ts', 'scripts/fetch-lib.ts') }}

      - name: Fetch libduckdb
        if: steps.libduckdb.outputs.cache-hit != 'true'
        run: bun run fetch-lib "$PLATFORM"

      - name: Measure coverage and check the floors
        run: bun run coverage

      - name: Upload the coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-linux-x64
          path: coverage/
          if-no-files-found: warn
          retention-days: 90

  # The Rust shim under AddressSanitizer: the native cargo tests (native/tests/*.rs) run with an
  # instrumented shim and standard library, so a heap or stack overflow, a use after free or a double
  # free in the shim fails the job. ASan needs nightly Rust (`-Zsanitizer=address`); -Zbuild-std
  # instruments std too, and `--target` keeps the flag off build scripts.
  #
  # The Bun suites do not run against an ASan shim here. On Linux, rustc links its ASan runtime
  # statically into executables only, never into a cdylib, and the Rust toolchain ships no shared
  # runtime to LD_PRELOAD into Bun. That needs `-Zexternal-clangrt` and a shared ASan runtime from the
  # same LLVM major version as the nightly rustc, loaded before Bun's allocator and signal handlers,
  # which no run has shown to work yet. On macOS the runtime must come in through
  # DYLD_INSERT_LIBRARIES, which the hardened runtime of the released Bun binary ignores.
  #
  # LeakSanitizer is off: libduckdb's process-lifetime allocations are not leaks of the shim, and
  # handle leaks are checked through diagnostics().liveHandles (leak, concurrency stress and soak).
  # native/diag-tests stays out: its children crash on purpose, and ASan's own SIGSEGV handler would
  # take the signal from the crash handler under test.
  asan:
    name: asan (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLATFORM: linux-x64
      # A dated nightly, so the sanitizer flags and their results do not change under the job.
      NIGHTLY: nightly-2026-11-10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # -Zbuild-std compiles the standard library from the rust-src component.
      - name: Install the nightly Rust toolchain
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src
          rustc "+$NIGHTLY" --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native -> target/asan
          key: asan

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Point the Rust build at this platform's libduckdb
        run: echo "DUCKDB_LIB_DIR=$GITHUB_WORKSPACE/packages/duckdb-bun-$PLATFORM" >> "$GITHUB_ENV"

      - name: Cache libduckdb
        id: libduckdb
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/duckdb-bun-linux-x64/libduckdb.*
          key: libduckdb-linux-x64-${{ hashFiles('src/version.ts', 'scripts/fetch-lib.ts') }}

      - name: Fetch libduckdb
        if: steps.libduckdb.outputs.cache-hit != 'true'
        run: bun run fetch-lib "$PLATFORM"

      - name: cargo test under AddressSanitizer
        working-directory: native
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
          CARGO_TARGET_DIR: target/asan
          ASAN_OPTIONS: detect_leaks=0
        run: cargo "+$NIGHTLY" test -Zbuild-std --target x86_64-unknown-linux-gnu

  docker-smoke:
    name: docker smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache libduckdb
        id: libduckdb
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/duckdb-bun-${{ matrix.platform }}/libduckdb.*
          key: libduckdb-${{ matrix.platform }}-${{ hashFiles('src/version.ts', 'scripts/fetch-lib.ts') }}

      - name: Fetch libduckdb
        if: steps.libduckdb.outputs.cache-hit != 'true'
        run: bun run fetch-lib "$PLATFORM"

      # The same image the release workflow builds the Linux shims in.
      # The runner's Bun binary is mounted in, so `bun run build:native` runs unchanged.
      - name: Build the native shim in the release image
        env:
          BUN_PATH: ${{ steps.bun.outputs.bun-path }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --volume "$BUN_PATH:/usr/local/bin/bun:ro" \
            --workdir /work \
            --env "DUCKDB_LIB_DIR=/work/packages/duckdb-bun-$PLATFORM" \
            "$RUST_IMAGE" \
            bash -euo pipefail -c 'rustup toolchain install && bun run build:native'

      - name: Pack the main and platform packages
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          bun pm pack --destination "$RUNNER_TEMP/packages"
          cd "packages/duckdb-bun-$PLATFORM"
          bun pm pack --destination "$RUNNER_TEMP/packages"
          ls -l "$RUNNER_TEMP/packages"

      # A fresh project that installs the two tarballs, as a user installs the published packages.
      # The override points the main package's optional dependency at the local platform tarball.
      - name: Create the consumer project
        run: |
          version="$(bun -p 'require("./package.json").version')"
          mkdir -p "$RUNNER_TEMP/smoke"
          cp tests/smoke/smoke.ts "$RUNNER_TEMP/smoke/smoke.ts"
          cat > "$RUNNER_TEMP/smoke/package.json" <<EOF
          {
            "name": "duckdb-bun-smoke",
            "private": true,
            "type": "module",
            "dependencies": {
              "@avidian/duckdb-bun": "file:/packages/avidian-duckdb-bun-${version}.tgz"
            },
            "overrides": {
              "@avidian/duckdb-bun-${PLATFORM}": "file:/packages/avidian-duckdb-bun-${PLATFORM}-${version}.tgz"
            }
          }
          EOF
          cat "$RUNNER_TEMP/smoke/package.json"

      - name: Run the smoke test in the production image
        run: |
          docker run --rm \
            --volume "$RUNNER_TEMP/packages:/packages:ro" \
            --volume "$RUNNER_TEMP/smoke:/app" \
            --workdir /app \
            "$BUN_IMAGE" \
            sh -euc 'bun install && bun smoke.ts'

      # The same reproduction as the test job, in the production image, where a downstream crash was reported.
      # It prints each package's exit code and its error or signal.
      - name: Issue 3060 reproduction in the production image
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            "$BUN_IMAGE" \
            bun test tests/heavy/issue-3060.test.ts
