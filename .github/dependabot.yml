version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Conventional Commits: "ci(deps): ..." and "build(deps): ...".
    commit-message:
      prefix: ci
      include: scope

  # The repository uses bun.lock, which Dependabot reads through the `bun` ecosystem, not `npm`.
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Pinned to the DuckDB in src/version.ts and tracked by the upstream-check workflow.
      - dependency-name: "@duckdb/node-api"
      # Pinned to the Bun in engines and packageManager; changed together with every workflow.
      - dependency-name: "@types/bun"
      # The TypeScript version `bun check` reports (process.versions.typescript); it moves with the Bun pin (ADR 0010).
      - dependency-name: typescript

  - package-ecosystem: cargo
    directory: "/native"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      # libduckdb-sys tracks the DuckDB in src/version.ts (docs/adr/0003); it moves with a DuckDB upgrade.
      - dependency-name: libduckdb-sys
